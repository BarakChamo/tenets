name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build --workspaces
      - run: npm pack --dry-run --workspaces
      # ESM packaging smoke: every package's built entry must import under plain Node.
      - run: |
          node -e "await import('./packages/result-ts/dist/index.js')"
          node -e "await import('./packages/invariant-ts/dist/index.js')"
          node -e "await import('./packages/env/dist/index.js')"
          node -e "await import('./packages/env/dist/typed-env/next.js')"
          node -e "await import('./packages/env/dist/node.js')"

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install build mypy
      # Build wheels from sdists and test installed artifacts, not source-path imports.
      - run: python -m build packages/invariant-py
      - run: python -m build packages/result-py
      - run: python -m pip install --no-deps packages/invariant-py/dist/*.whl packages/result-py/dist/*.whl
      - run: python -m unittest discover -s packages/invariant-py/tests -v
      - run: python -m unittest discover -s packages/result-py/tests -v
      - run: python -O -m unittest discover -s packages/invariant-py/tests
      - run: python -m mypy
      - name: Verify installed metadata and typing markers
        run: |
          python - <<'PY'
          from importlib.metadata import distribution
          from importlib.resources import files
          for name in ('invariant', 'result'):
              package = distribution(f'tenets-{name}')
              assert not package.requires, package.requires
              assert files(f'tenets_{name}').joinpath('py.typed').is_file()
          PY
